plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'mariohead'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mariohead" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mariohead-gametest"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

if (providers.gradleProperty('playtest').isPresent()) {
	apply from: 'playtest.gradle'
}

if (providers.gradleProperty('showcase').isPresent()) {
	sourceSets {
		showcase {
			compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
			runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
		}
		showcaseTest {
			compileClasspath += sourceSets.showcase.output + sourceSets.test.compileClasspath
			runtimeClasspath += sourceSets.showcase.output + sourceSets.test.runtimeClasspath
		}
	}
	loom {
		mods {
			'mariohead-showcase' { sourceSet sourceSets.showcase }
		}
		runs {
			showcase {
				inherit client
				sourceSet = sourceSets.showcase.name
				runDirectory = file('run')
			}
		}
	}
	tasks.register('showcaseTest', Test) {
		testClassesDirs = sourceSets.showcaseTest.output.classesDirs
		classpath = sourceSets.showcaseTest.runtimeClasspath
		useJUnitPlatform()
		maxParallelForks = 2
	}
}
